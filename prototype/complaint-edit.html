<div class="page-scope scope-complaint_edit"><div class="edit-container"><div class="edit-header"><div class="back-btn"><span>取消</span></div><div class="edit-title">编辑文书</div><div class="save-btn"><span>保存</span></div></div><div class="edit-content"><textarea class="edit-textarea" placeholder="请输入内容">事实与理由

原告于 2026 年 1 月 18 日通过某电商平台购买了被告销售的「冬季加厚羊毛混纺大衣」一件，商品页面明确标注面料成分为羊毛 70%、聚酯纤维 30%，价格 899 元，订单号 202601180001。

原告于 1 月 22 日收到商品后，经仔细查验发现：该大衣的实际手感粗糙板结，与页面宣传的羊毛质感明显不符；领口内侧水洗标标注的成分实为「聚酯纤维 100%」，与商品详情页描述存在实质性差异。原告已留存商品详情页截图、开箱视频及水洗标照片。

原告于 1 月 23 日通过平台客服联系被告要求退货退款，被告以「商品已拆封影响二次销售」为由拒绝，此后未再回复。

根据《中华人民共和国民法典》第五百七十七条、第五百八十二条及《中华人民共和国消费者权益保护法》第二十四条、第五十五条之规定，被告以虚假的商品描述误导原告作出购买决定，构成欺诈，应当承担退货退款及惩罚性赔偿责任。</textarea></div></div></div>
